<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Share</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <strong class="brand">CAD Share</strong>
      <span id="role" class="chip"></span>
      <span id="status" class="chip muted">Not connected</span>
      <div id="toolbar" class="toolbar"></div>
    </header>

    <main id="stage" class="stage">
      <div id="viewport" class="viewport">
        <div id="cursor" class="cursor hidden"><div class="ring"></div></div>
        <div id="banner" class="banner hidden"></div>
        <div id="toasts" class="toasts"></div>
      </div>
      <aside id="panel" class="panel"></aside>
    </main>

    <section id="landing" class="landing hidden">
      <h1>CAD Share</h1>
      <p>Show a 3D model to a customer and let them adjust it with hand gestures.</p>
      <button id="start-expert" class="primary">Start a session as the expert</button>
      <p class="muted">Customers join by opening the invite link the expert sends them.</p>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
